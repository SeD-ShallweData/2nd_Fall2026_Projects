name: Team Bbigeudeok public checks
on:
  push:
    paths: ['Team_Bbigeudeok/**', '.github/workflows/team-bbigeudeok.yml']
  pull_request:
    paths: ['Team_Bbigeudeok/**', '.github/workflows/team-bbigeudeok.yml']
permissions:
  contents: read
jobs:
  synthetic-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Team_Bbigeudeok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/check_public.py
