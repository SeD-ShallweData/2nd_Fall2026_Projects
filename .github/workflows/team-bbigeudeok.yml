name: BbiGeuDeok public checks
on:
  push:
    paths: ['BbiGeuDeok/**', '.github/workflows/team-bbigeudeok.yml']
  pull_request:
    paths: ['BbiGeuDeok/**', '.github/workflows/team-bbigeudeok.yml']
permissions:
  contents: read
jobs:
  synthetic-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BbiGeuDeok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - name: Synthetic demo gateway boundaries (loopback only)
        run: python -B tools/step4/test_demo_gateway.py
      - name: GCP persistent runtime synthetic checks
        run: python -B -m unittest discover -s infra/gcp -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_ui_state.cjs
      - run: python -B scripts/check_public.py
